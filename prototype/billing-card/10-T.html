<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>10-T 실패 - 프로토타입</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="billing.css">
</head>
<body>
<div class="layout">

  <div class="sidebar-left">
    <div class="panel-title">화면 목록</div>
    <ul class="index-list">
      <li class="is-current"><a href="01.html">정기결제 카드 등록/변경</a></li>
    </ul>
  </div>

  <div class="main-center">
    <div class="screen-canvas">
      <div class="result-center">
        <div class="result-icon is-danger">!</div>
        <h1>카드 등록에 실패했습니다 <span class="num-mark">1</span></h1>
        <p class="desc">카드사 인증에 실패했습니다. 카드 정보를 확인한 후 다시 시도해 주십시오. <span class="num-mark">2</span></p>

        <div class="kept-box">
          <div class="kept-title">선택하신 내용이 유지되었습니다 <span class="num-mark">3</span></div>
          <div class="site-mini-list" style="margin:0;">
            <div class="site-mini-row">
              <span class="checkbox-static">✓</span>
              플렉스 스토어 <span class="badge badge-info">Pro</span> <span class="site-mini-domain">store.flexg-sample.kr</span>
            </div>
            <div class="site-mini-row">
              <span class="checkbox-static">✓</span>
              브랜드 소개 홈페이지 <span class="badge badge-neutral">Basic</span> <span class="site-mini-domain">brand.flexg-sample.kr</span>
            </div>
            <div class="site-mini-row">
              <span class="checkbox-static">✓</span>
              팝업스토어 <span class="badge badge-info">Pro</span> <span class="site-mini-domain">popup.flexg-sample.kr</span>
            </div>
          </div>
        </div>

        <div class="info-box" style="max-width:420px; margin:12px auto 0;">
          기존 카드 ••••1234와 연결된 사이트는 변경되지 않았습니다.
          <span class="num-mark">4</span>
        </div>

        <div class="btn-row">
          <a href="01.html" class="btn">카드 목록으로 이동</a>
          <a href="05-T.html" class="btn btn-primary">다시 등록</a>
          <span class="num-mark">5</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-right">
    <h2>화면 설명</h2>
    <p class="desc-pending">내용은 추후 작성합니다.</p>
  </div>

</div>
</body>
</html>
