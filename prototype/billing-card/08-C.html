<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>08-C 완료 - 프로토타입</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="billing.css">
</head>
<body>
<div class="layout">

  <div class="sidebar-left">
    <div class="panel-title">화면 목록</div>
    <ul class="index-list">
      <li class="is-current"><a href="01.html">정기결제 카드 등록/변경</a></li>
    </ul>
  </div>

  <div class="main-center">
    <div class="screen-canvas">
      <div class="result-center">
        <div class="result-icon is-success">✓</div>
        <h1>새 카드가 연결되었습니다 <span class="num-mark">1</span></h1>
        <p class="desc">계정의 정기결제 카드가 변경되었습니다.</p>

        <div class="summary-card">
          <div class="card-icon"></div>
          <div>
            <div class="card-num">샘플카드 ••••9012</div>
          </div>
          <span class="num-mark">2</span>
        </div>

        <div style="display:flex; align-items:flex-start; gap:8px; max-width:420px; margin:16px auto 0;">
          <span class="num-mark">3</span>
          <div class="site-mini-list" style="margin:0;">
            <div class="site-mini-row">플렉스 스토어 <span class="site-mini-domain">store.flexg-sample.kr</span></div>
            <div class="site-mini-row">브랜드 소개 홈페이지 <span class="site-mini-domain">brand.flexg-sample.kr</span></div>
          </div>
        </div>

        <div class="btn-row">
          <a href="01.html" class="btn btn-primary">카드 목록으로 이동</a>
          <span class="num-mark">4</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-right">
    <h2>화면 설명</h2>
    <p class="desc-pending">내용은 추후 작성합니다.</p>
  </div>

</div>
</body>
</html>
